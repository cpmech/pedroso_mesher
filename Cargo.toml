[package]
name = "pedroso-mesher"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "Unstructured quad and hex mesh generation for finite element analysis"
repository = "https://github.com/cpmech/pedroso_mesher"
readme = "README.md"
keywords = ["mesh", "quad", "hex", "fem", "meshing"]
categories = ["science", "mathematics"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "warn"
