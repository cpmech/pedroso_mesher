[package]
name = "pedroso-mesher"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "Unstructured quad and hex mesh generation for finite element analysis"
repository = "https://github.com/cpmech/pedroso_mesher"
readme = "README.md"
keywords = ["mesh", "quad", "hex", "fem", "meshing"]
categories = ["science", "mathematics"]

[dependencies]
mwmatching = "0.1.1"
plotpy = "1.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spade = "2.15"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Both are deliberate here: the closure is clearer with a tuple return than with
# a struct, and several loops index two parallel arrays.
type_complexity = "allow"
needless_range_loop = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "warn"
